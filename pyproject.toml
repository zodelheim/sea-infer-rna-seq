  "catboost>=1.2.8",
  "cupy-cuda12x>=13.6.0",
  "gtfparse>=2.5.0",
  "loguru>=0.7.3",
  "matplotlib>=3.10.8",
  "mlflow>=3.9.0",
  "numpy<2.0.0",
  "openpyxl>=3.1.5",
  "pandas<3.0",
  "prefect>=3.6.16",
  "scikit-learn>=1.8.0",
  "scipy>=1.16.3",
  "seaborn>=0.13.2",
  "shap>=0.49.1",
  "tqdm>=4.67.3",
  "update>=0.0.1",
  "xgboost<3.1",
]
